name: CI and Docker Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks-and-build:
    name: Check source and build image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || {
            echo "Go files need formatting. Run: gofmt -w ."
            gofmt -l .
            exit 1
          }

      - name: Run static checks
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: devops-intern-task:ci

  publish:
    name: Publish image to Docker Hub
    needs: checks-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-intern-task:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-intern-task:${{ github.sha }}
